<!DOCTYPE html>
<html>
<head>
  <title>Paiement sécurisé</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 320px;
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #00bcd4;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
<h2>Paiement sécurisé 💳</h2>

<select id="country" onchange="updateOperators()">
  <option value="BEN">Bénin</option>
  <option value="CIV">Côte d'Ivoire</option>
  <option value="CMR">Cameroun</option>
</select>

<select id="operator"></select>

<input type="text" id="phone" placeholder="Numéro">
<input type="number" id="amount" placeholder="Montant">

<button onclick="payer()">Payer maintenant</button>

<p id="result"></p>
</div>

<script>

const operators = {
  BEN: ["MTN", "MOOV"],
  CIV: ["MTN", "ORANGE"],
  CMR: ["MTN", "ORANGE"]
};

function updateOperators() {
  const country = document.getElementById("country").value;
  const opSelect = document.getElementById("operator");

  opSelect.innerHTML = "";

  operators[country].forEach(op => {
    const option = document.createElement("option");
    option.value = op;
    option.text = op;
    opSelect.appendChild(option);
  });
}

updateOperators();

async function payer() {

  const phone = document.getElementById("phone").value.replace("+", "");
  const amount = document.getElementById("amount").value;
  const country = document.getElementById("country").value;
  const operator = document.getElementById("operator").value;
  const result = document.getElementById("result");

  if (!phone || !amount) {
    result.innerText = "❌ Remplis les champs";
    return;
  }

  result.innerText = "⏳ Paiement en cours...";

  try {
    const res = await fetch("https://orange-queen.serviceprive93.workers.dev/deposit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone,
        amount,
        country,
        operator
      })
    });

    const data = await res.json();
    console.log(data);

    if (data.status === "ACCEPTED") {
      result.innerText = "✅ Paiement envoyé 📲 Vérifie ton téléphone";
    } else {
      result.innerText = "❌ " + JSON.stringify(data);
    }

  } catch (e) {
    result.innerText = "❌ Serveur indisponible";
  }
}

</script>

</body>
</html>
