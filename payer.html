<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement ACDH</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box {
  background:white;
  padding:30px;
  width:350px;
  border-radius:10px;
}
input,select,button{
  width:100%;
  margin-top:10px;
  padding:10px;
}
button{
  background:#00bcd4;
  color:white;
  border:none;
}
#displayAmount{margin-top:10px;font-weight:bold;}
</style>
</head>

<body>

<div class="box">

<h3>Paiement ACDH</h3>

<select id="service" onchange="updateAmount()">
  <option value="visa">Visa Canada</option>
  <option value="immigration">Immigration</option>
  <option value="assistance">Assistance</option>
</select>

<select id="country" onchange="updateOperators();updateAmount();">
  <option value="CIV">Côte d'Ivoire</option>
  <option value="CMR">Cameroun</option>
  <option value="COD">RDC</option>
  <option value="COG">Congo</option>
  <option value="GAB">Gabon</option>
  <option value="SEN">Sénégal</option>
  <option value="BEN">Bénin</option>
</select>

<select id="operator"></select>

<input id="phone" placeholder="Numéro">

<p id="displayAmount"></p>

<button onclick="payer()">Payer</button>

<p id="result"></p>

</div>

<script>

const services = { visa:10, immigration:20, assistance:5 };

const currencies = {
  BEN:"XOF", CIV:"XOF", SEN:"XOF",
  CMR:"XAF", GAB:"XAF", COG:"XAF",
  COD:"CDF"
};

const operators = {
  BEN:["MTN","MOOV"],
  CMR:["MTN"],
  CIV:["MTN","ORANGE"],
  COD:["AIRTEL","ORANGE","VODACOM"],
  GAB:["AIRTEL"],
  COG:["AIRTEL","MTN"],
  SEN:["ORANGE","FREE"]
};

let rates={};

async function loadRates(){
  const r=await fetch("https://open.er-api.com/v6/latest/USD");
  rates=(await r.json()).rates;
}

function updateOperators(){
  const c=country.value;
  operator.innerHTML="";
  operators[c].forEach(o=>{
    let op=document.createElement("option");
    op.value=o;
    op.textContent=o;
    operator.appendChild(op);
  });
}

function updateAmount(){
  const usd=services[service.value];
  const cur=currencies[country.value];
  if(!rates[cur])return;
  const amt=Math.round(usd*rates[cur]);
  displayAmount.innerText="Montant : "+amt+" "+cur;
}

async function payer(){

  result.innerText="Traitement...";

  const res=await fetch("/api/pay",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      phone:phone.value,
      service:service.value,
      country:country.value,
      operator:operator.value
    })
  });

  const data=await res.json();

  result.innerText=data.status;
}

loadRates().then(()=>{
  updateOperators();
  updateAmount();
});

</script>

</body>
</html>
