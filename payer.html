<!DOCTYPE html>
<html>
<head>
  <title>Paiement sécurisé</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 320px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: #00bcd4;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
    }

    button:disabled {
      background: grey;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

<h2>Paiement sécurisé 💳</h2>

<select id="country" onchange="updateOperators()">
  <option value="BEN">Bénin</option>
  <option value="CMR">Cameroun</option>
  <option value="CIV">Côte d'Ivoire</option>
</select>

<select id="operator"></select>

<input type="text" id="phone" placeholder="Numéro (ex: 229XXXXXXXX)">
<input type="number" id="amount" placeholder="Montant">

<button id="btn" onclick="payer()">Payer maintenant</button>

<p id="result"></p>

</div>

<script>

// 🔥 OPERATEURS
const operatorsByCountry = {
  BEN: ["MTN", "MOOV"],
  CIV: ["MTN", "ORANGE"],
  CMR: ["MTN", "ORANGE"]
};

function updateOperators() {
  const country = document.getElementById("country").value;
  const operatorSelect = document.getElementById("operator");

  operatorSelect.innerHTML = "";

  operatorsByCountry[country].forEach(op => {
    const option = document.createElement("option");
    option.value = op;
    option.text = op;
    operatorSelect.appendChild(option);
  });
}

updateOperators();

// 🚀 PAIEMENT
async function payer() {

  const phone = document.getElementById("phone").value.trim();
  const amount = document.getElementById("amount").value;
  const country = document.getElementById("country").value;
  const operator = document.getElementById("operator").value;

  const result = document.getElementById("result");
  const btn = document.getElementById("btn");

  if (!phone || !amount) {
    result.innerText = "❌ Remplis tous les champs";
    return;
  }

  const cleanPhone = phone.replace("+", "");

  result.innerText = "⏳ Paiement en cours...";
  btn.disabled = true;

  try {
    const res = await fetch("https://canada-paiement-immigration.workers.dev/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone: cleanPhone,
        amount,
        country,
        operator
      })
    });

    const data = await res.json();

    console.log(data);

    if (data.status === "ACCEPTED") {
      result.innerText = "✅ Paiement envoyé 📲 Vérifiez votre téléphone";
    } else {
      result.innerText = "❌ " + JSON.stringify(data);
    }

  } catch (err) {
    console.log(err);
    result.innerText = "❌ Serveur indisponible (réessaie)";
  }

  btn.disabled = false;
}

</script>

</body>
</html>
