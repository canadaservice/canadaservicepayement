<!DOCTYPE html>
<html>
<head>
  <title>Paiement sécurisé</title>
  <style>
    body {
      font-family: Arial;
      padding: 30px;
      background: #f5f5f5;
    }

    input, select, button {
      padding: 10px;
      margin-top: 10px;
      width: 250px;
    }

    button {
      background: #00bcd4;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      background: grey;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<h2>Paiement sécurisé 💳</h2>

<!-- 🌍 PAYS -->
<select id="country" onchange="updateOperators()">
  <option value="BEN">Bénin</option>
  <option value="CMR">Cameroun</option>
  <option value="CIV">Côte d'Ivoire</option>
</select>

<br>

<!-- 📱 OPERATEUR -->
<select id="operator"></select>

<br>

<input type="text" id="phone" placeholder="Numéro (ex: 229XXXXXXXX)">
<br>

<input type="number" id="amount" placeholder="Montant">
<br>

<button id="btn" onclick="payer()">Payer maintenant</button>

<p id="result"></p>

<script>

// 🔥 OPERATEURS PAR PAYS
const operatorsByCountry = {
  BEN: ["MTN", "MOOV"],
  CIV: ["MTN", "ORANGE"],
  CMR: ["MTN", "ORANGE"]
};

// 🔄 mise à jour opérateurs
function updateOperators() {
  const country = document.getElementById("country").value;
  const operatorSelect = document.getElementById("operator");

  operatorSelect.innerHTML = "";

  operatorsByCountry[country].forEach(op => {
    const option = document.createElement("option");
    option.value = op;
    option.text = op;
    operatorSelect.appendChild(option);
  });
}

// 🚀 au chargement
updateOperators();

// 💳 PAIEMENT
async function payer() {
  const phone = document.getElementById("phone").value.trim();
  const amount = document.getElementById("amount").value;
  const country = document.getElementById("country").value;
  const operator = document.getElementById("operator").value;
  const result = document.getElementById("result");
  const btn = document.getElementById("btn");

  // 🔐 validation
  if (!phone || !amount) {
    result.innerText = "❌ Remplis tous les champs";
    return;
  }

  // 🔄 nettoyage numéro
  const cleanPhone = phone.replace("+", "");

  result.innerText = "⏳ Paiement en cours...";
  btn.disabled = true;

  try {
    const res = await fetch("https://pawapay-api.onrender.com/deposit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone: cleanPhone,
        amount,
        country,
        operator
      })
    });

    const data = await res.json();
    console.log(data);

    if (data.status === "ACCEPTED") {
      result.innerText = "✅ Paiement envoyé 📲 Vérifiez votre téléphone";
    } else {
      result.innerText = "❌ Erreur : " + JSON.stringify(data);
    }

  } catch (err) {
    console.log(err);
    result.innerText = "❌ Erreur réseau";
  }

  btn.disabled = false;
}

</script>

</body>
</html>
