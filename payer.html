<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Paiement ACDH</title>
</head>
<body style="font-family: Arial; text-align:center; margin-top:100px;">

<h2>Paiement sécurisé 💳</h2>

<input type="text" id="phone" placeholder="Numéro 229..." /><br><br>
<input type="number" id="amount" placeholder="Montant" /><br><br>

<button onclick="payer()">Payer maintenant</button>

<p id="msg"></p>

<script>
const params = new URLSearchParams(window.location.search);
const amount = params.get("amount");

if (amount) {
  document.getElementById("amount").value = amount;
}

async function payer() {
  const phone = document.getElementById("phone").value;
  const amount = document.getElementById("amount").value;

  document.getElementById("msg").innerText = "Traitement...";

  try {
    await fetch("https://pawapay-api.onrender.com/deposit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone,
        amount,
        country: "BEN"
      })
    });

    document.getElementById("msg").innerText =
      "📲 Validez sur votre téléphone";

  } catch (e) {
    document.getElementById("msg").innerText = "Erreur ❌";
  }
}
</script>

</body>
</html>
