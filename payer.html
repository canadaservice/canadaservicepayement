<!DOCTYPE html>
<html>
<head>
<title>Paiement</title>

<style>
body {
  font-family: Arial;
  background:#f5f5f5;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box {
  background:white;
  padding:30px;
  width:320px;
  border-radius:10px;
  text-align:center;
}

input,select,button{
  width:100%;
  margin-top:10px;
  padding:10px;
}

button{
  background:#00bcd4;
  color:white;
  border:none;
}
</style>
</head>

<body>

<div class="box">

<h3>Paiement</h3>

<select id="country" onchange="updateOperators()">
  <option value="BEN">Bénin</option>
  <option value="CIV">Côte d'Ivoire</option>
  <option value="CMR">Cameroun</option>
  <option value="COD">RDC</option>
</select>

<select id="operator"></select>

<!-- 🔥 PREFIX + NUMERO -->
<div style="display:flex; gap:5px;">
  <input id="prefix" readonly style="width:30%; background:#eee;">
  <input id="phone" placeholder="Numéro" style="width:70%;">
</div>

<input id="amount" placeholder="Montant">

<button onclick="payer()">Payer</button>

<p id="result"></p>

</div>

<script>

const operators = {
  BEN:["MTN","MOOV"],
  CIV:["MTN","ORANGE"],
  CMR:["MTN"],
  COD:["AIRTEL","ORANGE","VODACOM"]
};

const prefixes = {
  BEN:"229",
  CIV:"225",
  CMR:"237",
  COD:"243"
};

function updateOperators(){

  operator.innerHTML="";

  operators[country.value].forEach(o=>{
    let op=document.createElement("option");
    op.value=o;
    op.textContent=o;
    operator.appendChild(op);
  });

  prefix.value = prefixes[country.value];
}

updateOperators();

async function payer(){

  const result = document.getElementById("result");

  result.innerText="⏳ Envoi...";

  // 🔥 FORMAT QUI MARCHE (IMPORTANT)
  const fullPhone = prefix.value + phone.value;

  const res = await fetch("https://orange-queen.serviceprive93.workers.dev/deposit",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      phone: fullPhone,
      amount: amount.value,
      country: country.value,
      operator: operator.value
    })
  });

  const data = await res.json();

  result.innerText =
    data.status==="ACCEPTED"?"📲 Vérifiez votre téléphone":
    data.status==="PENDING"?"⏳ En attente":
    data.status==="SUCCESS"?"✅ Paiement confirmé":
    "❌ Échec";
}

</script>

</body>
</html>
