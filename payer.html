<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement ACDH</title>

<style>
body{
  font-family:Arial;
  background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("background.jpg") no-repeat center;
  background-size:cover;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.box{
  background:white;
  padding:30px;
  width:360px;
  border-radius:10px;
  text-align:center;
}

.logo{
  width:120px;
  margin-bottom:10px;
}

input,select,button{
  width:100%;
  margin-top:10px;
  padding:10px;
}

button{
  background:#00bcd4;
  color:white;
  border:none;
  font-weight:bold;
}

.note{
  font-size:12px;
  color:#666;
  text-align:left;
}

#result{
  margin-top:15px;
  padding:10px;
  background:#f5f5f5;
  border-radius:5px;
}
</style>
</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<h3>Paiement ACDH</h3>

<select id="country" onchange="setPrefix()">
  <option value="BEN">Bénin</option>
  <option value="CIV">Côte d'Ivoire</option>
  <option value="CMR">Cameroun</option>
  <option value="COD">RDC</option>
</select>

<select id="operator">
  <option>MTN</option>
</select>

<!-- 🔥 NUMERO AVEC PREFIX BLOQUÉ -->
<input id="phone">

<div class="note">
⚠️ Entrez uniquement votre numéro après l’indicatif
</div>

<button onclick="payer()">Payer</button>

<p id="result"></p>

</div>

<script>

// 📞 indicatifs
const prefixes={
  BEN:"229",
  CIV:"225",
  CMR:"237",
  COD:"243"
};

// 🔥 définir indicatif
function setPrefix(){
  const p = prefixes[country.value];
  phone.value = p;
}

// 🔒 empêcher suppression
phone.addEventListener("input",function(){
  const p = prefixes[country.value];
  if(!this.value.startsWith(p)){
    this.value = p;
  }
});

// 🔒 bloquer backspace sur indicatif
phone.addEventListener("keydown",function(e){
  const pLen = prefixes[country.value].length;
  if(this.selectionStart <= pLen && e.key === "Backspace"){
    e.preventDefault();
  }
});

// 🚀 paiement
async function payer(){

  const fullNumber = "+" + phone.value;

  result.innerText="⏳ Traitement...";

  const res = await fetch("/api/pay",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      phone: fullNumber,
      country: country.value,
      operator: operator.value,
      service:"biometrie"
    })
  });

  const data = await res.json();

  result.innerText = JSON.stringify(data);
}

// init
setPrefix();

</script>

</body>
</html>
