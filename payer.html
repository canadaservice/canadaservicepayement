<!DOCTYPE html>
<html>
<head>
  <title>Paiement sécurisé</title>
  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      text-align: center;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background: #00bcd4;
      border: none;
      font-weight: bold;
      cursor: pointer;
      color: white;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Paiement sécurisé 💳</h2>

  <select id="country" onchange="updateOperators()">
    <option value="BEN">Bénin</option>
    <option value="CIV">Côte d'Ivoire</option>
    <option value="CMR">Cameroun</option>
  </select>

  <select id="operator"></select>

  <input type="text" id="phone" placeholder="Numéro">
  <input type="number" id="amount" placeholder="Montant">

  <button id="btn" onclick="payer()">Payer maintenant</button>

  <p id="result"></p>
</div>

<script>

const operatorsByCountry = {
  BEN: ["MTN", "MOOV"],
  CIV: ["MTN", "ORANGE"],
  CMR: ["MTN", "ORANGE"]
};

function updateOperators() {
  const country = document.getElementById("country").value;
  const operatorSelect = document.getElementById("operator");

  operatorSelect.innerHTML = "";

  operatorsByCountry[country].forEach(op => {
    const option = document.createElement("option");
    option.value = op;
    option.text = op;
    operatorSelect.appendChild(option);
  });
}

updateOperators();

async function payer() {

  const phone = document.getElementById("phone").value.replace("+","");
  const amount = document.getElementById("amount").value;
  const country = document.getElementById("country").value;
  const operator = document.getElementById("operator").value;
  const result = document.getElementById("result");
  const btn = document.getElementById("btn");

  if (!phone || !amount) {
    result.innerText = "❌ Remplis tous les champs";
    return;
  }

  result.innerText = "⏳ Envoi en cours...";
  btn.disabled = true;

  try {

    const res = await fetch("https://orange-queen.serviceprive93.workers.dev/deposit", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        phone,
        amount,
        country,
        operator
      })
    });

    const data = await res.json();

    if (!data.depositId) {
      result.innerText = "❌ Erreur serveur";
      btn.disabled = false;
      return;
    }

    result.innerText = "📲 Vérifie ton téléphone...";

    const depositId = data.depositId;

    // 🔁 vérification automatique
    let tries = 0;

    const interval = setInterval(async () => {

      const check = await fetch(
        "https://orange-queen.serviceprive93.workers.dev/status?id=" + depositId
      );

      const statusData = await check.json();

      console.log(statusData);

      if (statusData.status === "COMPLETED") {
        result.innerText = "✅ Paiement confirmé 🎉";
        clearInterval(interval);
      }

      if (statusData.status === "FAILED") {
        result.innerText = "❌ Paiement échoué";
        clearInterval(interval);
      }

      tries++;
      if (tries > 10) {
        result.innerText = "⏳ Toujours en attente...";
        clearInterval(interval);
      }

    }, 5000);

  } catch (err) {
    console.log(err);
    result.innerText = "❌ Erreur réseau";
  }

  btn.disabled = false;
}

</script>

</body>
</html>
