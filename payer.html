<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paiement ACDH</title>

<style>
body{
  font-family:Arial;
  background:
    linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)),
    url("background.jpg") no-repeat center;
  background-size:cover;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.box{
  background:white;
  padding:30px;
  width:360px;
  border-radius:10px;
  text-align:center;
}

.logo{
  width:130px;
  margin-bottom:10px;
}

input,select,button{
  width:100%;
  margin-top:10px;
  padding:10px;
}

button{
  background:#00bcd4;
  color:white;
  border:none;
  font-weight:bold;
}

.note{
  font-size:12px;
  color:#666;
  text-align:left;
  margin-top:5px;
}

#result{
  margin-top:15px;
  padding:10px;
  border-radius:5px;
  background:#f5f5f5;
}

.footer{
  margin-top:20px;
  color:white;
  font-size:12px;
}
</style>
</head>

<body>

<div class="box">

<img src="logo.png" class="logo">

<h3>Paiement ACDH</h3>

<select id="service">
  <option value="biometrie">Données biométriques - 150 USD</option>
  <option value="langue">Test de langue - 150 USD</option>
  <option value="administratif">Droit administratif - 220 USD</option>
  <option value="total">Tout payer - 520 USD</option>
</select>

<select id="country">
  <option value="BEN">Bénin</option>
  <option value="CIV">Côte d'Ivoire</option>
  <option value="CMR">Cameroun</option>
  <option value="COD">RDC</option>
</select>

<select id="operator">
  <option>MTN</option>
</select>

<!-- 🔥 NUMERO SANS INDICATIF -->
<input id="phone" placeholder="Ex: 0142222197">

<div class="note">
⚠️ Entrez uniquement votre numéro sans indicatif
</div>

<button onclick="payer()">Payer</button>

<p id="result"></p>

</div>

<div class="footer">
© 2026 ACDH — Plateforme sécurisée 🔒
</div>

<script>

// indicatifs
const prefixes = {
  BEN:"229",
  CIV:"225",
  CMR:"237",
  COD:"243"
};

async function payer(){

  let num = phone.value.trim();

  // 🔥 supprimer si utilisateur met indicatif
  Object.values(prefixes).forEach(p=>{
    if(num.startsWith(p)){
      num = num.substring(p.length);
    }
  });

  const fullNumber = prefixes[country.value] + num;

  result.innerText="⏳ Traitement...";

  const res = await fetch("/api/pay",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      phone: fullNumber,
      service: service.value,
      country: country.value,
      operator: operator.value
    })
  });

  const data = await res.json();

  if(data.status==="SUCCESS"){
    result.innerHTML = `✅ Paiement confirmé<br>${data.amount} ${data.currency}`;
  } else if(data.status==="PENDING"){
    result.innerHTML = "📲 Vérifiez votre téléphone";
  } else {
    result.innerHTML = "❌ Échec du paiement";
  }
}

</script>

</body>
</html>
