<!DOCTYPE html>
<html>
<head>
  <title>Paiement sécurisé</title>
</head>
<body>
<p id="result" style="font-weight:bold; margin-top:20px;"></p>
<h2>Paiement sécurisé 💳</h2>

<!-- 🌍 Pays -->
<select id="country">
  <option value="BEN">Bénin</option>
  <option value="CMR">Cameroun</option>
  <option value="CIV">Côte d'Ivoire</option>
</select>

<br><br>

<!-- 📱 Operateur -->
<select id="operator">
  <option value="MTN">MTN</option>
  <option value="MOOV">Moov</option>
  <option value="ORANGE">Orange</option>
</select>

<br><br>

<input type="text" id="phone" placeholder="Numéro (ex: 229XXXXXXXX)">
<br><br>

<input type="number" id="amount" placeholder="Montant">
<br><br>

<button onclick="payer()">Payer maintenant</button>

<p id="result"></p>

<script>
async function payer() {
  const phone = document.getElementById("phone").value;
  const amount = document.getElementById("amount").value;
  const country = document.getElementById("country").value;
  const operator = document.getElementById("operator").value;

  const res = await fetch("https://pawapay-api.onrender.com/deposit", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      phone: phone,
      amount: amount,
      country: country,
      operator: operator
    })
  });

  const data = await res.json();
  document.getElementById("result").innerText = JSON.stringify(data);
}
</script>

</body>
</html>
