<!DOCTYPE html>
<html>
<head>
  <title>Paiement sécurisé</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #00bcd4;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: grey;
    }

    #result {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Paiement sécurisé 💳</h2>

  <!-- ✅ ORDRE CORRIGÉ + PAYS PAR DÉFAUT -->
  <select id="country" onchange="updateOperators()">
    <option value="CIV" selected>Côte d'Ivoire</option>
    <option value="CMR">Cameroun</option>
    <option value="COD">RDC (Congo Kinshasa)</option>
    <option value="COG">Congo Brazzaville</option>
    <option value="GAB">Gabon</option>
    <option value="SEN">Sénégal</option>
    <option value="BEN">Bénin</option>
  </select>

  <select id="operator"></select>

  <input type="text" id="phone" placeholder="Numéro (ex: 229XXXXXXXX)">
  <input type="number" id="amount" placeholder="Montant">

  <button id="btn" onclick="payer()">Payer maintenant</button>

  <p id="result"></p>
</div>

<script src="script.js"></script>

</body>
</html>
